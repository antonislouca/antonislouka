bio: >-
  I am a PhD candidate at the DistriNet Research Group, supervised by [Professor Jo Van Bulck](https://vanbulck.net/), focusing on systems security with an emphasis on firmware and low-level systems. My research explores the security challenges at the hardware–software boundary, including both attacks and defenses targeting privileged execution environments and hardware-assisted isolation mechanisms. I have prior experience with compiler infrastructures and reverse engineering frameworks.


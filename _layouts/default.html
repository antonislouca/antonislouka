<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    <script>
      // Set theme before paint to avoid flash.
      (function () {
        const stored = localStorage.getItem('theme');
        const prefers = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = stored || prefers;
      })();
    </script>
  </head>
  <body>
    {% include header.html %}

    <div class="page">
      {% include sidebar.html %}
      <main class="main">
        {% if page.title and page.url != "/" %}
          <header class="page-head">
            <h1>{{ page.title }}</h1>
            {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
          </header>
        {% endif %}
        <article class="prose">
          {{ content }}
        </article>
      </main>
    </div>

    {% include footer.html %}
    <script src="{{ '/assets/js/spa.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  </body>
</html>
